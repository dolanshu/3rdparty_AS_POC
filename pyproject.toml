[project]
name = "third-party-as-poc"
version = "1.0.0"
description = "Proof of concept of a third-party IMS/SIP Application Server (B2BUA) reached over a SIP trunk from the operator's S-SBC"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dolan Shu", email = "dolan.d.shu@gmail.com" }]
maintainers = [{ name = "Dolan Shu", email = "dolan.d.shu@gmail.com" }]
keywords = ["sip", "ims", "b2bua", "application-server", "sbc", "number-translation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Communications :: Telephony",
]

# The SIP stack version is pinned by AGENT.md section 6. Do not upgrade without
# asking the maintainer; sippy behaviour in this project is observed, not assumed.
#
# `as-platform` is the extracted platform skeleton (the shared shell of both AS instances),
# consumed from the sibling checkout `../as_platform` through the `[tool.uv.sources]` table
# below — ADR-0009 decision 6. It is not a registry dependency, so a single-repository
# checkout does not resolve it.
dependencies = [
  "sippy==2.4.2",
  "as-platform",
]

[project.optional-dependencies]
# fastapi + uvicorn are now runtime dependencies of the AS: the internal API (M3,
# ADR-0002) is a FastAPI application served by uvicorn on a daemon thread.
as = [
  "pydantic>=2.0",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]
console = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[dependency-groups]
dev = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx2>=2.13.0",
  "mypy>=1.9",
  "pydantic>=2.0",
  "pydantic-settings>=2.3",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pyyaml>=6.0",
  "ruff>=0.5",
  "types-pyyaml>=6.0",
]

# `as-platform` is consumed from the sibling checkout `../as_platform`, not a registry
# (ADR-0009 decision 6). `editable = true` is mandatory, not cosmetic: the staged extraction
# edits the library and immediately runs this repository's gate against it, and a `path`
# source without `editable = true` installs a copy instead of linking the checkout.
[tool.uv.sources]
as-platform = { path = "../as_platform", editable = true }

# The four packages under src/ (anti_fraud_as, as_app, console, s_sbc_mock) are separate
# runtime targets of one repository: two AS applications that never import each other, the
# console, and the mock. They are installed editable, so `uv sync` alone is enough to run
# `python -m as_app.main` or `python -m anti_fraud_as.main` from anywhere: no PYTHONPATH
# juggling for the reviewer.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anti_fraud_as", "src/as_app", "src/console", "src/s_sbc_mock"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: pure logic, no sockets",
  "integration: AS and mock on localhost UDP",
  "e2e: complete call flows including error branches",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist", "docs/ocr-review-*.md"]

[tool.ruff.lint]
select = [
  "A",   # builtins shadowing
  "B",   # bugbear
  "C4",  # comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8 naming
  "SIM", # simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  "D203", # 1 blank line required before class docstring (conflicts with D211)
  "D213", # multi-line summary should start at the second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"tools/call_load_generator.py" = ["D", "SIM105"]
"src/as_app/observability/logging.py" = ["A001", "A005"]
# The console page template is inline HTML/CSS/JS with intentionally long lines.
"src/console/main.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["anti_fraud_as", "as_app", "console", "s_sbc_mock"]
explicit_package_bases = true
# The sippy override below is forward-looking: sippy is imported from M1 onwards.
warn_unused_configs = false
warn_redundant_casts = true
warn_return_any = true
strict_optional = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = []

# sippy ships without type information; it is confined to sip_adapter.py and
# call_controller.py.
[[tool.mypy.overrides]]
module = ["sippy.*"]
ignore_missing_imports = true
