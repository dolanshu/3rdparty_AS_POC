# Local demo stack: the third-party AS, the mock Service-SBC and the console.
#
# The AS and the mock talk SIP over UDP on the trunk; the console reaches the AS over the
# internal HTTP API in a separate process (ADR-0002). Ports are declared explicitly so the
# port matrix in docs/operations/deployment.md and this file never drift apart.
#
# Usage:  docker compose -f deploy/docker-compose.yml up --build
#         make docker-up / make docker-down

name: third-party-as-poc

services:
  as:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.as
      # Build-time package index. Defaults to public PyPI, so CI is unaffected; a network
      # that cannot reach PyPI overrides them for its own build, e.g.
      #   PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple \
      #   docker compose -f deploy/docker-compose.yml build
      # (UV_DEFAULT_INDEX then follows PIP_INDEX_URL unless it is set explicitly.)
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-${PIP_INDEX_URL:-https://pypi.org/simple}}
    command: ["python", "-m", "as_app.main"]
    environment:
      # Address sippy advertises in the Via and Contact of every message the AS sends.
      # It must be a stable, mutually reachable trunk address (the fixed container IP
      # below), NOT 0.0.0.0: a 0.0.0.0 host can never be routed back to by the peer.
      SIP_LISTEN_ADDRESS: 172.28.0.2
      SIP_LISTEN_PORT: "5060"
      # Next hop for the INVITE the AS originates back to the trunk (mock UAS side).
      SBC_PEER_ADDRESS: 172.28.0.3
      SBC_PEER_PORT: "15061"
      # Source addresses accepted on the trunk, comma separated. The mock's INVITE arrives
      # from its fixed container IP 172.28.0.3 (see networks.trunk), so that is the only
      # entry that passes the allowlist; anything else is rejected with 403 / AS-PEER-001.
      ALLOWED_PEERS: 172.28.0.3
      # Compose-network variant of the sample rule set: same rules, but every next hop is the
      # mock's fixed trunk address (see config/routing_rules.compose.yaml).
      RULES_FILE: config/routing_rules.compose.yaml
      INTERNAL_API_ADDRESS: 0.0.0.0
      INTERNAL_API_PORT: "8080"
      LOG_LEVEL: INFO
      LOG_STRUCTURED: "true"
      LOG_PAYLOADS: "false"
    ports:
      - "5060:5060/udp"
      - "8080:8080/tcp"
    networks:
      trunk:
        ipv4_address: 172.28.0.2
    restart: unless-stopped

  s-sbc-mock:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.mock
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-${PIP_INDEX_URL:-https://pypi.org/simple}}
    command:
      - python
      - -m
      - s_sbc_mock.main
      - --listen-address
      - 172.28.0.3
      - --listen-port
      - "15061"
      - --as-address
      - 172.28.0.2
      - --as-port
      - "5060"
    ports:
      # 15060/udp is the UAC side (emulated S-CSCF trigger), 15061/udp the UAS side
      # (emulated core network) that receives the translated INVITE.
      - "15060:15060/udp"
      - "15061:15061/udp"
    networks:
      trunk:
        ipv4_address: 172.28.0.3
    restart: unless-stopped

  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.console
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-${PIP_INDEX_URL:-https://pypi.org/simple}}
    command: ["python", "-m", "console.main", "--address", "0.0.0.0", "--port", "8081"]
    environment:
      AS_INTERNAL_API_URL: http://as:8080
    ports:
      - "8081:8081/tcp"
    depends_on:
      - as
    networks:
      - trunk
    restart: unless-stopped

networks:
  trunk:
    name: as-poc-trunk
    # Fixed subnet and static container IPs keep SIP signalling self-consistent: the AS and
    # the mock advertise each other's IP in Via/Contact, and ALLOWED_PEERS can name the
    # mock's exact source IP. 0.0.0.0 would be unreachable as a peer address.
    ipam:
      config:
        - subnet: 172.28.0.0/24
